# Deploy project page + leaderboard via GitHub Pages
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/logo.png"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync logo into docs
        run: |
          mkdir -p docs/assets
          cp assets/logo.png docs/assets/logo.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
