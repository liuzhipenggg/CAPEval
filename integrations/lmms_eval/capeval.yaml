# CAPEval task for lmms-eval (external include_path).
#
# Prepare data once:
#   python -m integrations.lmms_eval.prepare_data
#
# Run (from CAPEval root or with CAPEVAL_HOME set):
#   export CAPEVAL_HOME=/path/to/CAPEval
#   python -m lmms_eval \
#     --model qwen2_vl \
#     --model_args pretrained=Qwen/Qwen2-VL-7B-Instruct \
#     --tasks capeval \
#     --include_path $CAPEVAL_HOME/integrations/lmms_eval \
#     --batch_size 1 \
#     --output_path ./lmms_capeval_out

task: "capeval"
dataset_path: json
dataset_kwargs:
  data_files:
    # Generated by: python -m integrations.lmms_eval.prepare_data
    # Prefer absolute path via CAPEVAL_INFER_JSONL, else default under this folder.
    test: data/capeval_infer.jsonl
test_split: test
output_type: generate_until
doc_to_visual: !function utils.capeval_doc_to_visual
doc_to_text: !function utils.capeval_doc_to_text
doc_to_messages: !function utils.capeval_doc_to_messages
generation_kwargs:
  max_new_tokens: 1024
  temperature: 0.0
process_results: !function utils.capeval_process_results
metric_list:
  - metric: capeval_c
    aggregation: !function utils.capeval_aggregate_c
    higher_is_better: true
  - metric: capeval_p
    aggregation: !function utils.capeval_aggregate_p
    higher_is_better: true
metadata:
  version: 0.1
